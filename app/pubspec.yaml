name: heartline
description: "Heartline — a private, shared emotional space for couples."
publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.11.1

# Add packages with `flutter pub add <package>` so pub resolves the latest compatible version.
# Never copy versions from docs. See docs/FLUTTER_GUIDE.md → "Packages".
dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ^17.5.0
  fpdart: ^1.2.0
  dio: ^5.11.1
  supabase_flutter: ^2.18.3
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  flutter_secure_storage: ^11.2.0
  lottie: ^3.6.1
  lucide_icons_flutter: ^3.1.25
  flutter_svg: ^2.3.0
  intl: ^0.20.3
  equatable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  build_runner: ^2.15.1
  objectbox_generator: ^5.3.2

flutter:
  uses-material-design: true
